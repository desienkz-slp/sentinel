version: 1.0.0
# Registry entries are declarations, not permission grants. Disabled tools may
# not be presented to the model or invoked by workflows.
#
# Set enabled:true ONLY after the real endpoint + least-privilege credentials
# are supplied via NOC_*_URL / NOC_*_TOKEN. The adapter layer reads those env
# vars; nothing here stores secrets.
tools:
  - name: billing.get_customer
    domain: billing
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: billing
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Ambil data akun/status pelanggan dari sistem billing.
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Nomor telepon ternormalisasi (628xxx) atau ID pelanggan.
      required: [identity]

  - name: billing.get_history
    domain: billing
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: billing
    timeout_seconds: 10
    retry: safe_get
    verification: response_contract
    description: Riwayat tagihan bulanan + tunggakan satu pelanggan (token Bearer, read-only).
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Username pelanggan.
      required: [identity]

  - name: billing.list_customers
    domain: billing
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: billing
    timeout_seconds: 15
    retry: safe_get
    verification: response_contract
    description: Ringkasan/daftar pelanggan billing (aktif, nonaktif, isolir, cari) - read-only.
    parameters:
      type: object
      properties:
        filter:
          type: string
          description: aktif | nonaktif | isolir | cari (kosong = ringkasan jumlah).
        search:
          type: string
          description: Kata kunci nama/username/nomor (untuk filter cari).
      required: []

  - name: radius.get_session
    domain: radius
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: radius
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Ambil status sesi aktif PPP dari Radius UI (ip, durasi, traffic).
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Username PPP (opsional; kosong = semua sesi aktif).
      required: []

  - name: radius.get_user
    domain: radius
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: radius
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Ambil data user PPP (profil, NAS, status) dari Radius UI.
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Username PPP (opsional; kosong = semua user).
      required: []

  - name: radius.get_system_stats
    domain: radius
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: radius
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Statistik server Radius UI (CPU/RAM/db/jumlah user).
    parameters:
      type: object
      properties: {}
      required: []

  - name: mikrotik.get_pppoe_status
    domain: mikrotik
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: mikrotik
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Ambil status sesi PPPoE (aktif/putus) dari router MikroTik.
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Username PPPoE atau nomor pelanggan ternormalisasi.
      required: [identity]

  - name: mikrotik.get_interface_stats
    domain: mikrotik
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: mikrotik
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Statistik kumulatif interface (rx/tx byte, drop, error).
    parameters:
      type: object
      properties:
        interface:
          type: string
          description: Nama interface (opsional; kosong = semua).
      required: []

  - name: mikrotik.get_interface_live
    domain: mikrotik
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: mikrotik
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Traffic live (bits per second) satu interface.
    parameters:
      type: object
      properties:
        interface:
          type: string
          description: Nama interface (mis. ether1).
      required: [interface]

  - name: mikrotik.get_customer_traffic
    domain: mikrotik
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: mikrotik
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Traffic live satu pelanggan dari interface PPPoE aktif yang di-resolve tepat oleh identity.
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Username PPPoE tepat untuk resolusi satu sesi dan interface aktif.
      required: [identity]

  - name: genieacs.get_device_state
    domain: genieacs
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: genieacs
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Ambil status perangkat ONT/CPE (online/offline, sinyal) dari GenieACS.
    parameters:
      type: object
      properties:
        device_id:
          type: string
          description: Serial number atau ID perangkat CPE/ONT.
        identity:
          type: string
          description: Nomor pelanggan ternormalisasi (alternatif bila device_id tidak ada).
      required: []

  - name: genieacs.get_devices
    domain: genieacs
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: genieacs
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Daftar semua device di GenieACS (opsional filter online/offline).
    parameters:
      type: object
      properties:
        status:
          type: string
          description: 'online / offline (opsional; kosong = semua).'
      required: []

  - name: mikrotik.disconnect_pppoe
    domain: mikrotik
    version: 1.0.0
    enabled: false
    permission: WRITE
    risk: MEDIUM
    scope: single_customer
    idempotency: required
    approval: required
    verification: mikrotik.get_pppoe_status
    rollback: escalate
    description: Putuskan sesi PPPoE yang stale (butuh persetujuan operator).
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Username PPPoE atau nomor pelanggan ternormalisasi.
        idempotency_key:
          type: string
          description: Kunci idempotensi untuk mencegah pemutusan ganda.
      required: [identity, idempotency_key]
