version: 1.0.0
# Registry entries are declarations, not permission grants. Disabled tools may
# not be presented to the model or invoked by workflows.
#
# Set enabled:true ONLY after the real endpoint + least-privilege credentials
# are supplied via NOC_*_URL / NOC_*_TOKEN. The adapter layer reads those env
# vars; nothing here stores secrets.
tools:
  - name: billing.get_customer
    domain: billing
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: billing
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Ambil projection status diagnostik satu pelanggan; identity wajib, satu halaman server, tanpa PII.
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Nomor telepon ternormalisasi (628xxx) atau ID pelanggan.
      required: [identity]

  - name: billing.get_history
    domain: billing
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: billing
    timeout_seconds: 10
    retry: safe_get
    verification: response_contract
    description: "BLOCKED: upstream history belum memiliki pagination/projection server-side yang aman."
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Username pelanggan.
      required: [identity]

  - name: billing.list_customers
    domain: billing
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: billing
    timeout_seconds: 15
    retry: safe_get
    verification: response_contract
    description: Ringkasan count pelanggan saja; satu halaman server untuk metadata, tanpa record pelanggan.
    parameters:
      type: object
      properties:
        filter:
          type: string
          description: aktif | nonaktif | isolir | cari (kosong = ringkasan jumlah).
        search:
          type: string
          description: Kata kunci nama/username/nomor (untuk filter cari).
      required: []


  - name: radius.get_system_stats
    domain: radius
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: radius
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Statistik server Radius UI (CPU/RAM/db/jumlah user).
    parameters:
      type: object
      properties: {}
      required: []

  - name: mikrotik.get_pppoe_status
    domain: mikrotik
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: mikrotik
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    scope: single_customer
    description: Ambil status tepat satu sesi PPPoE (aktif/putus) dari router MikroTik; identity wajib dan exact.
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Username PPPoE tepat; wajib untuk filter RouterOS ?name exact.
      required: [identity]

  - name: mikrotik.get_interface_stats
    domain: mikrotik
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: mikrotik
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    scope: single_interface
    description: Statistik kumulatif tepat satu interface (rx/tx byte, drop, error); interface wajib dan exact.
    parameters:
      type: object
      properties:
        interface:
          type: string
          description: Nama interface tepat; wajib untuk filter RouterOS ?name exact.
      required: [interface]

  - name: mikrotik.get_interface_live
    domain: mikrotik
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: mikrotik
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    scope: single_interface
    description: Traffic live (bits per second) tepat satu interface.
    parameters:
      type: object
      properties:
        interface:
          type: string
          description: Nama interface (mis. ether1).
      required: [interface]

  - name: mikrotik.get_customer_traffic
    domain: mikrotik
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: mikrotik
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Traffic live satu pelanggan dari interface PPPoE aktif yang di-resolve tepat oleh identity.
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Username PPPoE tepat untuk resolusi satu sesi dan interface aktif.
      required: [identity]

  - name: genieacs.get_device_state
    domain: genieacs
    version: 1.0.0
    enabled: false
    permission: READ
    risk: LOW
    source_of_truth: genieacs
    timeout_seconds: 8
    retry: safe_get
    verification: response_contract
    description: Lookup status satu ONT/CPE dengan device ID tepat; respons diproyeksikan dan tanpa raw device ID.
    parameters:
      type: object
      properties:
        device_id:
          type: string
          description: Device ID/serial GenieACS tepat untuk satu ONT/CPE.
      required: [device_id]

  - name: mikrotik.disconnect_pppoe
    domain: mikrotik
    version: 1.0.0
    enabled: false
    permission: WRITE
    risk: MEDIUM
    scope: single_customer
    idempotency: required
    approval: required
    verification: mikrotik.get_pppoe_status
    rollback: escalate
    description: Putuskan sesi PPPoE yang stale (butuh persetujuan operator).
    parameters:
      type: object
      properties:
        identity:
          type: string
          description: Username PPPoE atau nomor pelanggan ternormalisasi.
        idempotency_key:
          type: string
          description: Kunci idempotensi untuk mencegah pemutusan ganda.
      required: [identity, idempotency_key]
